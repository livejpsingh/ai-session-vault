server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  autoconfigure:
    # Exclude all AI model client auto-configs that require external API keys.
    # This service is an MCP SERVER — it does not call any AI model directly.
    # Re-enable individual entries only when activating local-rag or cloud-rag profiles.
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  profiles:
    # RAG requires Ollama + pgvector (local-rag) or Gemini + pgvector (cloud-rag).
    # Leave blank for core vault operation (MCP server + REST API + PostgreSQL FTS).
    active: ${SPRING_PROFILES_ACTIVE:}

  threads:
    virtual:
      enabled: true

  application:
    name: ai-session-vault

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_session_vault}
    username: ${SPRING_DATASOURCE_USERNAME:vault_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vault_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      embeddingDimension: ${VAULT_RAG_EMBEDDING_DIMENSION:768}

  ai:
    mcp:
      server:
        name: ai-session-vault
        version: 1.0.0
        type: sync
        # streamable-http — current MCP spec (2025-03-26). Antigravity connects via /mcp
        transport: streamable-http

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    defaultModelsExpandDepth: 2

vault:
  security:
    api-key: ${VAULT_API_KEY:vault-secret-key-2026}
  storage:
    attachments-dir: ${VAULT_ATTACHMENTS_DIR:./vault-storage/attachments}
  rag:
    # RAG disabled by default. Enable via SPRING_PROFILES_ACTIVE=local-rag or cloud-rag
    enabled: false
    embedding-dimension: ${VAULT_RAG_EMBEDDING_DIMENSION:768}
    max-tokens: ${VAULT_RAG_CHUNK_MAX_TOKENS:800}
    overlap-tokens: ${VAULT_RAG_CHUNK_OVERLAP_TOKENS:100}
    embedding-batch-size: ${VAULT_RAG_EMBEDDING_BATCH_SIZE:32}
    max-attempts: ${VAULT_RAG_MAX_ATTEMPTS:5}
    retry-initial-delay: ${VAULT_RAG_RETRY_INITIAL_DELAY:2s}
    poll-interval: ${VAULT_RAG_POLL_INTERVAL:5s}
    job-lease: ${VAULT_RAG_JOB_LEASE:10m}
    max-concurrent-jobs: ${VAULT_RAG_MAX_CONCURRENT_JOBS:4}
    rrf-k: ${VAULT_RAG_RRF_K:60}
    recency-half-life: ${VAULT_RAG_RECENCY_HALF_LIFE:90d}
    recency-weight: ${VAULT_RAG_RECENCY_WEIGHT:0.1}
