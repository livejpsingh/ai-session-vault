name: Feature Request
description: Propose a new capability, MCP tool, or optimization improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an open-ended architecture idea or question? Consider starting in [GitHub Discussions](https://github.com/livejpsingh/ai-session-vault/discussions) first!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this solve for AI coding agents or developers?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the API, MCP tool, schema change, or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR for this feature
