spring:
  datasource:
    url: jdbc:h2:mem:vault_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  ai:
    google:
      genai:
        api-key: test-dummy-genai-key
    mcp:
      server:
        enabled: false

vault:
  security:
    api-key: vault-secret-key-2026
  storage:
    attachments-dir: ./target/test-attachments
