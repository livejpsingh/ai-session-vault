spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
    openai:
      api-key: local-profile-does-not-use-openai
    google:
      genai:
        api-key: local-profile-does-not-use-google

vault:
  rag:
    provider: ollama
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    query-prefix: "search_query: "
    document-prefix: "search_document: "
    tokenizer: bert-wordpiece
    tokenizer-vocab-path: ${OLLAMA_TOKENIZER_VOCAB_PATH:./models/nomic-embed-text-v1.5/vocab.txt}
