name: CI Pipeline — Build, Test & Security Audit

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-and-test:
    name: Compile, Test & Verify
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_session_vault
          POSTGRES_USER: vault_user
          POSTGRES_PASSWORD: vault_test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault_user -d ai_session_vault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Execute Maven Tests & Verifications
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_session_vault
          SPRING_DATASOURCE_USERNAME: vault_user
          SPRING_DATASOURCE_PASSWORD: vault_test_password_ci
          VAULT_API_KEY: ci-test-secret-key-32chars-minimum!
        run: |
          ./mvnw clean test --batch-mode

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package Application JAR
        run: |
          ./mvnw package -DskipTests --batch-mode

      - name: Archive Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/ai-session-vault-0.0.1-SNAPSHOT.jar
          retention-days: 3
