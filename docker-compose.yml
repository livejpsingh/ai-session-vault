services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-session-vault-db
    restart: always
    environment:
      POSTGRES_DB: ai_session_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d ai_session_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-session-vault-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_session_vault
      SPRING_DATASOURCE_USERNAME: vault_user
      SPRING_DATASOURCE_PASSWORD: vault_password
      VAULT_API_KEY: ${VAULT_API_KEY:-vault-secret-key-2026}
      VAULT_ATTACHMENTS_DIR: /vault-storage/attachments
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - vault-storage:/vault-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - vault-net

volumes:
  pgdata:
  vault-storage:

networks:
  vault-net:
    driver: bridge
